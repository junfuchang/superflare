{{ define "settings-ports.html" }}<div class="setting-group-container"><form method="POST" action="{{ .SettingPages.Ports.Path }}" id="form-ports"><h2>{{ T .Locale "settings_ports" }}</h2><div class="form-group"><p class="help-text">{{ T .Locale "ports_help" }}</div><div class="form-group ports-actions"><input class="btn-submit" type="button" value='{{ T .Locale "refresh_ports" }}' id="refresh-ports">
<input class="btn-submit" type="button" value='{{ T .Locale "hide_all_ports" }}' id="hide-all-ports">
<input class="btn-submit" type="button" value='{{ T .Locale "unhide_all_ports" }}' id="unhide-all-ports">
<input class="btn-submit" type="submit" value='{{ T .Locale "save_changes" }}'>
<label class="ports-toggle"><input type="checkbox" id="show-hidden-ports">
{{ T .Locale "show_hidden_ports" }}
</label><input type="hidden" name="ports" id="field-ports"></div><div id="ports-status" class="ports-status"></div><div class="ports-table-shell"><div id="container-ports"></div></div></form><script type="text/html" id="data-ports">{{.PortsData}}</script><style>.setting-group-container{--ports-table-surface:rgba(18, 18, 18, 0.97);--ports-table-surface-strong:rgba(28, 28, 28, 0.99);--ports-table-border:rgba(255, 253, 234, 0.14);--ports-table-text:rgba(239, 251, 255, 0.96);--ports-table-text-muted:rgba(239, 251, 255, 0.72);--ports-table-input-surface:rgba(239, 251, 255, 0.96);--ports-table-input-text:#171717;--ports-table-accent:rgba(255, 165, 0, 0.24);--ports-table-danger:rgba(122, 38, 38, 0.62)}.ports-toggle{display:inline-flex;align-items:center;gap:6px;margin:6px 0 6px 12px;color:var(--color-primary);font-weight:500}.ports-toggle input{accent-color:color-mix(in srgb,var(--color-accent) 78%,var(--color-primary) 22%)}.ports-status{min-height:24px;display:flex;align-items:center;gap:8px;color:color-mix(in srgb,var(--color-primary) 84%,transparent);opacity:.86}.ports-status.loading::before{content:"";width:13px;height:13px;border:2px solid color-mix(in srgb,var(--color-primary) 18%,transparent);border-top-color:color-mix(in srgb,var(--color-primary) 84%,transparent);border-radius:50%;animation:ports-spin .8s linear infinite}.ports-status.error{color:#a73636}.ports-status.warning{color:color-mix(in srgb,var(--color-accent) 84%,var(--color-primary) 16%)}.ports-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}.ports-actions .btn-submit{margin:0!important}.ports-actions .ports-toggle{margin:0 0 0 auto}.ports-table-shell{margin-top:8px;border:1px solid var(--ports-table-border);background:var(--ports-table-surface);min-height:160px;overflow:hidden}#container-ports,#container-ports .handsontable,#container-ports .handsontable .wtHolder,#container-ports .handsontable .wtHider,#container-ports .handsontable .wtSpreader,#container-ports .handsontable .ht_master,#container-ports .handsontable .ht_clone_top,#container-ports .handsontable .ht_clone_left,#container-ports .handsontable .ht_clone_top_left_corner{background:var(--ports-table-surface)!important;color:var(--ports-table-text)!important}#container-ports .handsontable table,#container-ports .handsontable .htCore{background:var(--ports-table-surface)!important;color:var(--ports-table-text)!important}#container-ports .handsontable col.rowHeader{background:var(--ports-table-surface-strong)!important}#container-ports .handsontable th,#container-ports .handsontable td,#container-ports .handsontable .htCore th,#container-ports .handsontable .htCore td{border-color:var(--ports-table-border)!important;color:var(--ports-table-text)!important}#container-ports .handsontable thead th,#container-ports .handsontable .ht_clone_top th,#container-ports .handsontable .ht_clone_left th,#container-ports .handsontable .ht_clone_top_left_corner th,#container-ports .handsontable th.ht__row_header,#container-ports .handsontable th.ht__column_header{background:var(--ports-table-surface-strong)!important;color:var(--ports-table-text)!important;font-weight:600}#container-ports .handsontable tbody th,#container-ports .handsontable tbody th:first-child,#container-ports .handsontable .ht_clone_left th,#container-ports .handsontable .ht_clone_top_left_corner th{background:var(--ports-table-surface-strong)!important;color:var(--ports-table-text)!important;font-weight:600;border-right-color:var(--ports-table-border)!important}#container-ports .handsontable tbody th .relative,#container-ports .handsontable tbody th:first-child .relative,#container-ports .handsontable tbody th .rowHeader,#container-ports .handsontable tbody th:first-child .rowHeader,#container-ports .handsontable .ht_clone_left th .relative,#container-ports .handsontable .ht_clone_left th .rowHeader{background:0 0!important;color:inherit!important}#container-ports .handsontable thead th .relative,#container-ports .handsontable .ht_clone_top th .relative,#container-ports .handsontable .ht_clone_top_left_corner th .relative,#container-ports .handsontable thead th .colHeader,#container-ports .handsontable .ht_clone_top th .colHeader,#container-ports .handsontable .ht_clone_top_left_corner th .colHeader,#container-ports .handsontable thead th .cornerHeader,#container-ports .handsontable .ht_clone_top th .cornerHeader,#container-ports .handsontable .ht_clone_top_left_corner th .cornerHeader{background:0 0!important;color:inherit!important}#container-ports .handsontable td{background:var(--ports-table-surface)!important}#container-ports .handsontable .htDimmed,#container-ports .handsontable .htAutocompleteArrow{color:var(--ports-table-text-muted)!important}#container-ports .handsontableInput{background:var(--ports-table-input-surface)!important;color:var(--ports-table-input-text)!important;border-color:rgba(255,253,234,.3)!important}#container-ports .htSelectEditor,#container-ports .htNumericInput{background:var(--ports-table-input-surface)!important;color:var(--ports-table-input-text)!important;border-color:rgba(255,253,234,.3)!important}@keyframes ports-spin{to{transform:rotate(360deg)}}@media(max-width:720px){.ports-actions .ports-toggle{margin-left:0;width:100%}}</style><script>(function () {
const locale = '{{.Locale}}' === 'en' ? 'en-US' : 'zh-CN';
const dataURI = '{{.PortsDataURI}}';
const form = document.getElementById('form-ports');
const fieldPorts = document.getElementById('field-ports');
const status = document.getElementById('ports-status');
const showHidden = document.getElementById('show-hidden-ports');
const hideAllButton = document.getElementById('hide-all-ports');
const unhideAllButton = document.getElementById('unhide-all-ports');
const initialData = JSON.parse(document.getElementById('data-ports').textContent || '[]');
function normalizeData(items) {
return (items || []).map(function (item) {
return {
Port: item.Port || '',
Protocol: item.Protocol || 'tcp',
ServiceName: item.Running ? (item.ServiceName || '') : '',
RunningText: item.Running ? '{{ T .Locale "port_running" }}' : '{{ T .Locale "port_stopped" }}',
Running: !!item.Running,
PID: item.Running ? (item.PID || '') : '',
Hidden: !!item.Hidden,
Remark: item.Remark || ''
};
});
}
function setStatus(text, loading, error, warning) {
status.textContent = text || '';
status.className = 'ports-status'
+ (loading ? ' loading' : '')
+ (error ? ' error' : '')
+ (warning ? ' warning' : '');
}
function parseFailureResponse(response, fallbackMessage) {
return response.text().then(function (raw) {
if (!raw) {
return fallbackMessage;
}
try {
const payload = JSON.parse(raw);
const detail = payload && payload.detail ? String(payload.detail).trim() : '';
const message = payload && payload.error ? String(payload.error).trim() : fallbackMessage;
return detail ? (message + ': ' + detail) : message;
} catch (error) {
return raw.trim() || fallbackMessage;
}
}).then(function (message) {
throw new Error(message || fallbackMessage);
});
}
function extractItems(payload) {
if (Array.isArray(payload)) {
return payload;
}
if (payload && Array.isArray(payload.items)) {
return payload.items;
}
return [];
}
function extractWarnings(payload) {
if (!payload || !Array.isArray(payload.warnings)) {
return [];
}
return payload.warnings.map(function (item) {
return String(item || '').trim();
}).filter(Boolean);
}
function setHiddenStateForAll(nextHidden) {
const data = hot.getSourceData().map(function (item) {
return Object.assign({}, item, { Hidden: !!nextHidden });
});
hot.loadData(data);
setStatus(nextHidden ? '{{ T .Locale "ports_all_hidden" }}' : '{{ T .Locale "ports_all_unhidden" }}', false, false, false);
}
const hot = new Handsontable(document.getElementById('container-ports'), {
language: locale,
data: normalizeData(initialData),
colHeaders: [
'{{ T .Locale "port_number" }}',
'{{ T .Locale "port_protocol" }}',
'{{ T .Locale "port_service_name" }}',
'{{ T .Locale "port_running_state" }}',
'{{ T .Locale "port_pid" }}',
'{{ T .Locale "port_hidden" }}',
'{{ T .Locale "port_remark" }}'
],
rowHeaders: true,
columns: [
{ data: 'Port', readOnly: true },
{ data: 'Protocol', readOnly: true },
{ data: 'ServiceName', readOnly: true },
{ data: 'RunningText', readOnly: true },
{ data: 'PID', readOnly: true },
{ data: 'Hidden', type: 'checkbox' },
{ data: 'Remark' }
],
colWidths: [82, 68, 130, 92, 72, 72, 320],
height: 'auto',
stretchH: 'all',
manualColumnResize: true,
licenseKey: 'non-commercial-and-evaluation'
});
function loadPorts() {
const query = showHidden.checked ? '?includeHidden=1' : '';
setStatus('{{ T .Locale "ports_loading" }}', true, false);
return fetch(dataURI + query, { headers: { 'Accept': 'application/json' } })
.then(function (response) {
if (!response.ok) {
return parseFailureResponse(response, 'ports request failed');
}
return response.json();
})
.then(function (payload) {
const items = extractItems(payload);
const warnings = extractWarnings(payload);
hot.loadData(normalizeData(items));
if (warnings.length > 0) {
setStatus(warnings.join(' '), false, false, true);
return;
}
setStatus('', false, false, false);
})
.catch(function (error) {
const detail = error && error.message ? error.message : '';
const text = detail ? ('{{ T .Locale "ports_load_failed" }}: ' + detail) : '{{ T .Locale "ports_load_failed" }}';
setStatus(text, false, true, false);
});
}
form.addEventListener('submit', function (event) {
event.preventDefault();
const payload = hot.getSourceData().filter(function (item) {
return item.Port && ((item.Remark || '').trim() || item.Hidden);
}).map(function (item) {
return {
Port: item.Port,
Protocol: item.Protocol || 'tcp',
Hidden: !!item.Hidden,
Remark: (item.Remark || '').trim()
};
});
fieldPorts.value = JSON.stringify(payload);
setStatus('{{ T .Locale "ports_saving" }}', true, false, false);
const body = new URLSearchParams();
body.set('ports', fieldPorts.value);
body.set('includeHidden', showHidden.checked ? '1' : '0');
fetch(form.action, {
method: 'POST',
headers: {
'Accept': 'application/json',
'Content-Type': 'application/x-www-form-urlencoded'
},
body: body.toString()
}).then(function (response) {
if (!response.ok) {
return parseFailureResponse(response, 'save failed');
}
setStatus('{{ T .Locale "ports_saved" }}', false, false, false);
return loadPorts();
}).catch(function (error) {
const detail = error && error.message ? error.message : '';
const text = detail ? ('{{ T .Locale "ports_save_failed" }}: ' + detail) : '{{ T .Locale "ports_save_failed" }}';
setStatus(text, false, true, false);
});
});
document.getElementById('refresh-ports').addEventListener('click', function () {
loadPorts();
});
hideAllButton.addEventListener('click', function () {
setHiddenStateForAll(true);
});
unhideAllButton.addEventListener('click', function () {
setHiddenStateForAll(false);
});
showHidden.addEventListener('change', function () {
loadPorts();
});
loadPorts();
}());</script></div>{{ end }}
