{{ define "settings-ports.html" }}<div class="setting-group-container"><form method="POST" action="{{ .SettingPages.Ports.Path }}" id="form-ports"><h2>{{ T .Locale "settings_ports" }}</h2><div class="form-group"><p class="help-text">{{ T .Locale "ports_help" }}</div><div class="form-group"><input class="btn-submit" type="button" value='{{ T .Locale "refresh_ports" }}' id="refresh-ports">
<input class="btn-submit" type="submit" value='{{ T .Locale "save_changes" }}'>
<label class="ports-toggle"><input type="checkbox" id="show-hidden-ports">
{{ T .Locale "show_hidden_ports" }}
</label><input type="hidden" name="ports" id="field-ports"></div><div id="ports-status" class="ports-status"></div><div class="ports-table-shell"><div id="container-ports"></div></div></form><script type="text/html" id="data-ports">{{.PortsData}}</script><style>.ports-toggle{display:inline-flex;align-items:center;gap:6px;margin:6px 0 6px 12px;color:var(--color-primary)}.ports-status{min-height:24px;display:flex;align-items:center;gap:8px;color:var(--color-primary);opacity:.86}.ports-status.loading::before{content:"";width:13px;height:13px;border:2px solid rgba(255,253,234,.35);border-top-color:var(--color-primary);border-radius:50%;animation:ports-spin .8s linear infinite}.ports-status.error{color:#ff9d9d}.ports-table-shell{margin-top:8px;border:1px solid rgba(255,253,234,.18);background:rgba(18,18,18,.96);min-height:160px;overflow:hidden}#container-ports,#container-ports .handsontable,#container-ports .handsontable .wtHolder,#container-ports .handsontable .wtHider,#container-ports .handsontable .wtSpreader,#container-ports .handsontable .ht_master,#container-ports .handsontable .ht_clone_top,#container-ports .handsontable .ht_clone_left,#container-ports .handsontable .ht_clone_top_left_corner{background:rgba(18,18,18,.96)!important;color:var(--color-primary)!important}#container-ports .handsontable table,#container-ports .handsontable .htCore{background:rgba(18,18,18,.96)!important;color:var(--color-primary)!important}#container-ports .handsontable col.rowHeader{background:rgba(34,34,34,.98)!important}#container-ports .handsontable th,#container-ports .handsontable td,#container-ports .handsontable .htCore th,#container-ports .handsontable .htCore td{border-color:rgba(255,253,234,.14)!important;color:var(--color-primary)!important}#container-ports .handsontable thead th,#container-ports .handsontable .ht_clone_top th,#container-ports .handsontable .ht_clone_left th,#container-ports .handsontable .ht_clone_top_left_corner th,#container-ports .handsontable th.ht__row_header,#container-ports .handsontable th.ht__column_header{background:rgba(34,34,34,.98)!important;color:var(--color-primary)!important;font-weight:600}#container-ports .handsontable tbody th,#container-ports .handsontable tbody th:first-child,#container-ports .handsontable .ht_clone_left th,#container-ports .handsontable .ht_clone_top_left_corner th{background:rgba(34,34,34,.98)!important;color:var(--color-primary)!important;font-weight:600;border-right-color:rgba(255,253,234,.14)!important}#container-ports .handsontable tbody th .relative,#container-ports .handsontable tbody th:first-child .relative,#container-ports .handsontable tbody th .rowHeader,#container-ports .handsontable tbody th:first-child .rowHeader,#container-ports .handsontable .ht_clone_left th .relative,#container-ports .handsontable .ht_clone_left th .rowHeader{background:0 0!important;color:inherit!important}#container-ports .handsontable td{background:rgba(18,18,18,.96)!important}#container-ports .handsontable .htDimmed,#container-ports .handsontable .htAutocompleteArrow{color:rgba(255,253,234,.72)!important}#container-ports .handsontableInput{background:#1f1f1f!important;color:var(--color-primary)!important;border-color:rgba(255,253,234,.3)!important}@keyframes ports-spin{to{transform:rotate(360deg)}}</style><script>(function () {
const locale = '{{.Locale}}' === 'en' ? 'en-US' : 'zh-CN';
const dataURI = '{{.PortsDataURI}}';
const form = document.getElementById('form-ports');
const fieldPorts = document.getElementById('field-ports');
const status = document.getElementById('ports-status');
const showHidden = document.getElementById('show-hidden-ports');
const initialData = JSON.parse(document.getElementById('data-ports').textContent || '[]');
function normalizeData(items) {
return (items || []).map(function (item) {
return {
Port: item.Port || '',
Protocol: item.Protocol || 'tcp',
ServiceName: item.Running ? (item.ServiceName || '') : '',
RunningText: item.Running ? '{{ T .Locale "port_running" }}' : '{{ T .Locale "port_stopped" }}',
Running: !!item.Running,
PID: item.Running ? (item.PID || '') : '',
Hidden: !!item.Hidden,
Remark: item.Remark || ''
};
});
}
function setStatus(text, loading, error) {
status.textContent = text || '';
status.className = 'ports-status' + (loading ? ' loading' : '') + (error ? ' error' : '');
}
const hot = new Handsontable(document.getElementById('container-ports'), {
language: locale,
data: normalizeData(initialData),
colHeaders: [
'{{ T .Locale "port_number" }}',
'{{ T .Locale "port_protocol" }}',
'{{ T .Locale "port_service_name" }}',
'{{ T .Locale "port_running_state" }}',
'{{ T .Locale "port_pid" }}',
'{{ T .Locale "port_hidden" }}',
'{{ T .Locale "port_remark" }}'
],
rowHeaders: true,
columns: [
{ data: 'Port', readOnly: true },
{ data: 'Protocol', readOnly: true },
{ data: 'ServiceName', readOnly: true },
{ data: 'RunningText', readOnly: true },
{ data: 'PID', readOnly: true },
{ data: 'Hidden', type: 'checkbox' },
{ data: 'Remark' }
],
colWidths: [82, 68, 130, 92, 72, 72, 320],
height: 'auto',
stretchH: 'all',
manualColumnResize: true,
licenseKey: 'non-commercial-and-evaluation'
});
function loadPorts() {
const query = showHidden.checked ? '?includeHidden=1' : '';
setStatus('{{ T .Locale "ports_loading" }}', true, false);
return fetch(dataURI + query, { headers: { 'Accept': 'application/json' } })
.then(function (response) {
if (!response.ok) {
throw new Error('ports request failed');
}
return response.json();
})
.then(function (items) {
hot.loadData(normalizeData(items));
setStatus('', false, false);
})
.catch(function () {
setStatus('{{ T .Locale "ports_load_failed" }}', false, true);
});
}
form.addEventListener('submit', function (event) {
event.preventDefault();
const payload = hot.getSourceData().filter(function (item) {
return item.Port && ((item.Remark || '').trim() || item.Hidden);
}).map(function (item) {
return {
Port: item.Port,
Protocol: item.Protocol || 'tcp',
Hidden: !!item.Hidden,
Remark: (item.Remark || '').trim()
};
});
fieldPorts.value = JSON.stringify(payload);
setStatus('{{ T .Locale "ports_saving" }}', true, false);
const body = new URLSearchParams();
body.set('ports', fieldPorts.value);
body.set('includeHidden', showHidden.checked ? '1' : '0');
fetch(form.action, {
method: 'POST',
headers: {
'Accept': 'application/json',
'Content-Type': 'application/x-www-form-urlencoded'
},
body: body.toString()
}).then(function (response) {
if (!response.ok) {
throw new Error('save failed');
}
setStatus('{{ T .Locale "ports_saved" }}', false, false);
return loadPorts();
}).catch(function () {
setStatus('{{ T .Locale "ports_save_failed" }}', false, true);
});
});
document.getElementById('refresh-ports').addEventListener('click', function () {
loadPorts();
});
showHidden.addEventListener('change', function () {
loadPorts();
});
loadPorts();
}());</script></div>{{ end }}
