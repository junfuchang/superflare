services:
  superflare:
    image: superflare:latest
    container_name: superflare
    restart: unless-stopped
    ports:
      - "3636:3636"
    volumes:
      - superflare-data:/data
    environment:
      FLARE_PORT: "3636"
      FLARE_DISABLE_LOGIN: "false"
      # 首次部署前建议替换为稳定且足够随机的值，避免容器重建后登录会话失效。
      FLARE_COOKIE_SECRET: "please-change-superflare-cookie-secret"

volumes:
  superflare-data:
