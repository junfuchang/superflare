services:
  superflare:
    image: superflare:latest
    container_name: superflare
    restart: unless-stopped
    ports:
      - "3636:3636"
    volumes:
      - superflare-data:/data
    environment:
      FLARE_PORT: "3636"
      FLARE_DISABLE_LOGIN: "false"
      # Replace this with a stable random value before first deployment.
      FLARE_COOKIE_SECRET: "please-change-superflare-cookie-secret"

volumes:
  superflare-data:
