{{ define "settings-theme.html" }}
<div class="setting-group-container">
    <form method="POST" action="{{ .SettingPages.Theme.Path }}">
        <h2>{{ T .Locale "settings_theme" }}</h2>
        <div class="theme-groups clearfix">
            {{range .Themes}}
            <div class="pull-left theme theme-{{.Name}}">
                <div class="theme-container clearfix">
                    <input class="theme-choose" name="theme" type="submit" value="{{.Name}}">
                    <div class="pull-left theme-color color-background"
                        style="background-color: {{.Colors.Background}};">
                    </div>
                    <div class="pull-left theme-color color-primary" style="background-color: {{.Colors.Primary}};">
                    </div>
                    <div class="pull-left theme-color color-accent" style="background-color: {{.Colors.Accent}};"></div>
                </div>
                <p class="theme-title">{{.Name}}</p>
            </div>
            {{end}}
        </div>
    </form>

    <form method="POST" action="{{ .SettingPages.Theme.Path }}" enctype="multipart/form-data">
        <h2>{{ T .Locale "custom_rgba_theme" }}</h2>
        <div class="form-group">
            <label for="custom-theme-background">{{ T .Locale "theme_background_color" }}</label>
            <input type="text" name="custom-theme-background" id="custom-theme-background" class="option-input" data-color-picker="true" placeholder="rgba(26, 26, 26, 1)" value="{{.CustomThemeBackground}}">
        </div>
        <div class="form-group">
            <label for="custom-theme-primary">{{ T .Locale "theme_primary_color" }}</label>
            <input type="text" name="custom-theme-primary" id="custom-theme-primary" class="option-input" data-color-picker="true" placeholder="rgba(255, 253, 234, 1)" value="{{.CustomThemePrimary}}">
        </div>
        <div class="form-group">
            <label for="custom-theme-accent">{{ T .Locale "theme_accent_color" }}</label>
            <input type="text" name="custom-theme-accent" id="custom-theme-accent" class="option-input" data-color-picker="true" placeholder="rgba(92, 92, 92, 1)" value="{{.CustomThemeAccent}}">
            <p class="help-text">{{ T .Locale "custom_theme_help" }}</p>
        </div>
        <div class="form-group">
            <label for="settings-background-image">{{ T .Locale "custom_background_image" }}</label>
            <input type="text" name="background-image" id="settings-background-image" class="option-input" placeholder="https://example.com/background.jpg" value="{{.OptionBackgroundImage}}">
            <p class="help-text">{{ T .Locale "custom_background_image_help" }}</p>
        </div>

        <div class="form-group">
            <label for="settings-background-file">{{ T .Locale "upload_background_image" }}</label>
            <input type="file" name="background-file" id="settings-background-file" accept=".jpg,.jpeg,.png,.webp,.gif,image/*">
            <p class="help-text">{{ T .Locale "upload_background_image_help" }}</p>
        </div>

        <div class="form-group">
            <label for="settings-background-blur">{{ T .Locale "background_blur_strength" }}</label>
            <input type="number" min="0" max="80" name="background-blur" id="settings-background-blur" class="option-input" value="{{.OptionBackgroundBlur}}">
        </div>

        <div class="form-group">
            <label for="settings-background-opacity">{{ T .Locale "background_opacity" }}</label>
            <input type="number" min="0" max="100" name="background-opacity" id="settings-background-opacity" class="option-input" value="{{.OptionBackgroundOpacity}}">
        </div>

        <div class="form-group">
            <label for="settings-glass-effect">{{ T .Locale "glass_effect" }}</label>
            <select name="glass-effect" id="settings-glass-effect">
                <option value="none" {{ if eq .OptionGlassEffect "none" }}selected{{ end }}>{{ T .Locale "glass_off" }}</option>
                <option value="frosted" {{ if eq .OptionGlassEffect "frosted" }}selected{{ end }}>{{ T .Locale "glass_frosted" }}</option>
                <option value="liquid" {{ if eq .OptionGlassEffect "liquid" }}selected{{ end }}>{{ T .Locale "glass_liquid" }}</option>
            </select>
        </div>

        <div class="form-group">
            <label for="settings-glass-intensity">{{ T .Locale "glass_strength" }}</label>
            <input type="number" min="0" max="100" name="glass-intensity" id="settings-glass-intensity" class="option-input" value="{{.OptionGlassIntensity}}">
        </div>
        <div class="form-group">
            <input type="hidden" name="action" value="custom-theme">
            <input type="hidden" name="theme" value="custom">
            <input class="btn-submit" type="submit" value='{{ T .Locale "save_changes" }}' />
        </div>
    </form>
</div>
{{ end }}
