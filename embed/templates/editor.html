    <style>
        body {
            min-height: 100vh;
            background-color: var(--color-background);
            color: var(--color-primary);
        }

        .editor-page {
            width: min(1440px, calc(100% - 48px));
            margin: 0 auto;
            padding: 20px 0 32px;
        }

        .editor-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px 18px;
            margin-bottom: 14px;
        }

        .editor-header-copy h1 {
            font-size: 26px;
            line-height: 1.15;
            display: block;
        }

        .editor-header-copy p {
            max-width: 720px;
            margin-top: 6px;
            line-height: 1.65;
            font-size: 13px;
            color: color-mix(in srgb, var(--color-primary) 84%, transparent);
        }

        .editor-header-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .editor-button,
        .editor-button:visited,
        .editor-file-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 16px;
            border: 1px solid color-mix(in srgb, var(--color-primary) 16%, transparent);
            border-radius: 6px;
            background: rgba(18, 18, 18, 0.72);
            color: var(--color-primary);
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.18s ease, background-color 0.18s ease, opacity 0.18s ease;
        }

        .editor-button:hover,
        .editor-file-label:hover {
            border-color: color-mix(in srgb, var(--color-accent) 60%, white 10%);
            background: rgba(24, 24, 24, 0.88);
        }

        .editor-button[disabled] {
            opacity: 0.65;
            cursor: default;
        }

        .editor-button-state-success {
            background: rgba(56, 110, 56, 0.74);
            border-color: rgba(118, 202, 118, 0.44);
        }

        .editor-button-state-warning {
            background: rgba(124, 74, 24, 0.78);
            border-color: rgba(227, 162, 90, 0.44);
        }

        .editor-button-state-error {
            background: rgba(122, 38, 38, 0.78);
            border-color: rgba(228, 108, 108, 0.44);
        }

        .editor-toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            gap: 18px;
            margin-bottom: 18px;
        }

        .editor-panel {
            border: 1px solid rgba(255, 253, 234, 0.16);
            border-radius: 8px;
            background: rgba(15, 15, 15, 0.76);
            padding: 16px 18px;
        }

        .editor-panel h2 {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .editor-panel-full {
            grid-column: 1 / -1;
        }

        .editor-panel-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 16px;
        }

        .editor-panel-header h2 {
            margin-bottom: 0;
        }

        .editor-panel p {
            line-height: 1.64;
            font-size: 13px;
            color: color-mix(in srgb, var(--color-primary) 82%, transparent);
        }

        .editor-backup-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .editor-file-label {
            min-width: 148px;
        }

        .editor-file-label span {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .editor-file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .editor-restore-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .editor-actions-grid {
            display: grid;
            gap: 12px;
        }

        .editor-compact-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            justify-content: space-between;
            gap: 10px 14px;
        }

        .editor-search-box {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px 12px;
            min-width: 0;
        }

        .editor-search-box label {
            flex: 0 0 auto;
            font-weight: 600;
            color: var(--color-primary);
            white-space: nowrap;
        }

        .editor-search-box input {

            border: 1px solid rgba(255, 253, 234, 0.16);
            border-radius: 6px;
            padding: 10px 12px;
            background: rgba(12, 12, 12, 0.92);

        }

        .editor-search-box input::placeholder {

        }

        .editor-search-box input:focus {
            border-color: color-mix(in srgb, var(--color-accent) 76%, white 10%);
        }

        .editor-search-status {
            flex: 0 0 auto;
            min-width: 88px;
            font-size: 12px;
            color: color-mix(in srgb, var(--color-primary) 76%, transparent);

        .editor-search-nav {

            gap: 8px;
            align-items: center;
        }

        .editor-search-nav .editor-button {

        }

            white-space: nowrap;
        }

            display: grid;
            gap: 18px;
        }

        .editor-table-panel {
            display: grid;
            gap: 14px;
        }

        .editor-table-header {

            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px 18px;
        }

        .editor-table-header h2 {

        }

            background: rgba(18, 18, 18, 0.92);
            overflow: hidden;
        }

        .editor-inline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .editor-bookmarks-toolbar {

            align-items: end;

        }

        .editor-bookmarks-toolbar-actions {

        }

        @media (max-width: 1080px) {

    <script>
        const tableLocale = '{{.Locale}}' === 'en' ? 'en-US' : 'zh-CN';
        const TABLE_ROW_HEIGHT = 27;
        const TABLE_HEADER_HEIGHT = 30;
        const TABLE_FRAME_HEIGHT = 4;
        let categories = JSON.parse(document.getElementById("data-categories").innerHTML) || [];
        const dataBookmarks = JSON.parse(document.getElementById("data-bookmarks").innerHTML) || [];
        const dataPorts = JSON.parse(document.getElementById("data-ports").textContent || "[]") || [];
        const localLANHost = '{{.LocalLANHost}}';
        const localPortDisplayMap = {};
        const localPortValueMap = {};
        const localPortOptions = dataPorts.map(function (item) {
            const protocol = (item.Protocol || 'tcp').toLowerCase() === 'udp' ? 'udp' : 'tcp';
            const scheme = protocol === 'udp' ? 'udp' : 'http';
            const value = scheme + '://' + localLANHost + ':' + item.Port;
            const label = '\u3010' + item.Port + '\u3011' + (item.Remark || '');
            localPortDisplayMap[value] = label;
            localPortValueMap[label] = value;
            return label;
        });

        let categoriesMap = categories.reduce((prev, item) => {
            prev[item.ID] = item.Name; return prev;
        }, {})
        const FLARE_FIX_CATEGORY = ["[SuperFlare \u5e94\u7528]"];
        let bookmarks = dataBookmarks.filter(item => item.Category && item.Name && item.URL).map(item => {
            if (item.Category === '_FLARE_FIXED_CATEGORY') {
                item.Category = FLARE_FIX_CATEGORY[0];
            } else {
                item.Category = categoriesMap[item.Category]
            }
            item.LocalURL = item.LocalURL || '';
            item.CheckResult = '';
            return item;
        }).sort((a, b) => (a.Category + "").localeCompare(b.Category + ""));

        function tableHeightForRows(rowCount) {
            return TABLE_HEADER_HEIGHT + (Math.max(rowCount, 1) * TABLE_ROW_HEIGHT) + TABLE_FRAME_HEIGHT;
        }
    </script>

    <script>
        const instanceCategories = new Handsontable(document.getElementById('container-category'), {
            language: tableLocale,
            data: categories,
            colHeaders: ['\u5206\u7c7b\u540d\u79f0'],
            rowHeaders: true,
            manualRowMove: true,
            contextMenu: ["row_above", "row_below", "---------", "undo", "redo", "---------", "cut", "copy"],
            columns: [
                { data: 'Name' },
            ],
            height: tableHeightForRows(categories.length),
            renderAllRows: true,
            manualColumnResize: true,
            afterChange: (changes) => {
                if (!changes) { return }
                changes.forEach(function ([row, prop, oldValue, newValue]) {
                    categoriesMap = Object.keys(categoriesMap).reduce(function (prev, key) {
                        if (categoriesMap[key] == oldValue) {
                            prev[key] = newValue;
                        } else {
                            prev[key] = categoriesMap[key]
                        }
                        return prev;
                    }, {});

                    bookmarks = bookmarks.map(function (bookmark) {
                        if (bookmark.Category == oldValue) {
                            bookmark.Category = newValue;
                        }
                        return bookmark;
                    });
                });
                updateDataTable()
            },
            afterCreateRow: function () {
                scheduleTableLayoutSync();
            },
            afterRemoveRow: function () {
                scheduleTableLayoutSync();
            },
            licenseKey: 'non-commercial-and-evaluation'
        });

        function coverRenderer(instance, td, row, col, prop, value, cellProperties) {
            const stringifiedValue = Handsontable.helper.stringify(value);

            Handsontable.renderers.TextRenderer.apply(this, arguments);
            return;

            if (stringifiedValue.startsWith('http')) {
                const img = document.createElement('IMG');

                img.src = value;

                Handsontable.dom.addEvent(img, 'mousedown', event => {
                    event.preventDefault();
                });

                Handsontable.dom.empty(td);
                td.appendChild(img);
            } else if (stringifiedValue !== '') {

                const img = document.createElement('IMG');

                img.src = '/assets/mdi/blackboard-' + (value + '').toLowerCase() + '.svg{{.DebugAssetVersion}}';

                Handsontable.dom.addEvent(img, 'mousedown', event => {
                    event.preventDefault();
                });

                Handsontable.dom.empty(td);
                td.className = 'bookmark-icon'
                td.appendChild(img);

            } else {
                Handsontable.renderers.TextRenderer.apply(this, arguments);
            }
        }


        const searchField = document.querySelector('#search');
        const searchApplyButton = document.getElementById('search-apply');
        const searchPrevButton = document.getElementById('search-prev');
        const searchNextButton = document.getElementById('search-next');
        const searchResultCount = document.getElementById('search-result-count');
        const fileInput = document.getElementById('editor-backup-file');
        const fileName = document.getElementById('editor-backup-file-name');
        const container = document.getElementById('container-bookmarks');
        const dataTableColumns = buildDataTableColumns();
        let tableLayoutFrame = null;
        const bookmarkSearchState = {
            term: '',
            matches: [],
            activeIndex: -1,
        };
        let instanceBookmarks = new Handsontable(container, {
            language: tableLocale,
            data: Array.from(bookmarks),
            colHeaders: ['\u4e66\u7b7e\u540d\u79f0', '\u4e66\u7b7e\u5730\u5740', '\u5185\u7f51\u5730\u5740', '\u7c7b\u578b', '\u5b50\u76ee\u5f55', '\u56fe\u6807', '\u63cf\u8ff0', '\u68c0\u67e5\u7ed3\u679c'],
            rowHeaders: true,
            manualRowMove: true,
            contextMenu: ["row_above", "row_below", "---------", "undo", "redo", "---------", "cut", "copy"],
            columns: dataTableColumns,
            height: tableHeightForRows(bookmarks.length),
            stretchH: 'all',
            renderAllRows: true,
            manualColumnResize: true,
            afterCreateRow: function () {
                scheduleTableLayoutSync();
            },
            afterRemoveRow: function () {
                scheduleTableLayoutSync();
            },
            licenseKey: 'non-commercial-and-evaluation'
        });

        fileInput.addEventListener('change', function () {
            const selected = this.files && this.files[0] ? this.files[0].name : '\u9009\u62e9\u5907\u4efd\u6587\u4ef6';
            fileName.textContent = selected;
        });

        searchField.addEventListener('input', function () {
            if (!bookmarkSearchState.term && !bookmarkSearchState.matches.length) { return; }
            bookmarkSearchState.term = '';
            bookmarkSearchState.matches = [];
            bookmarkSearchState.activeIndex = -1;
            updateSearchStatus();
            instanceBookmarks.render();
        });

        searchField.addEventListener('keydown', function (event) {
            if (event.key !== 'Enter') { return; }
            event.preventDefault();
            runBookmarkSearch(searchField.value, false);
        });

        searchApplyButton.addEventListener('click', function () {
            runBookmarkSearch(searchField.value, false);
        });

        searchPrevButton.addEventListener('click', function () {
            moveBookmarkSearch(-1);
        });

        searchNextButton.addEventListener('click', function () {
            moveBookmarkSearch(1);
        });

        function syncTableLayouts() {
            instanceCategories.updateSettings({
                height: tableHeightForRows(instanceCategories.countRows())
            });
            instanceBookmarks.updateSettings({
                height: tableHeightForRows(instanceBookmarks.countRows())
            });
            instanceCategories.render();
            instanceBookmarks.render();
        }

        function scheduleTableLayoutSync() {
            if (tableLayoutFrame) {
                cancelAnimationFrame(tableLayoutFrame);
            }
            tableLayoutFrame = requestAnimationFrame(function () {
                tableLayoutFrame = requestAnimationFrame(function () {
                    syncTableLayouts();
                    tableLayoutFrame = null;
                });
            });
        }

        function bindData() {
            const options = { bom: false, columnDelimiter: ',', columnHeaders: false, exportHiddenColumns: true, exportHiddenRows: true, rowDelimiter: '\r\n', rowHeaders: true };
            const exportedCategories = instanceCategories.getPlugin('exportFile').exportAsString('csv', options);
            const exportedBookmarks = exportBookmarksCSV();
            document.getElementById('field-categories').value = exportedCategories;
            document.getElementById('field-bookmarks').value = exportedBookmarks;
        }

        function csvEscape(value) {
            const text = value == null ? '' : String(value);
            if (/[",\r\n]/.test(text)) {
                return '"' + text.replace(/"/g, '""') + '"';
            }
            return text;
        }

        function exportBookmarksCSV() {
            return instanceBookmarks.getSourceData().map(function (item, idx) {
                return [
                    idx + 1,
                    item.Name || '',
                    item.URL || '',
                    item.LocalURL || '',
                    item.Category || '',
                    item.Subdir || '',
                    item.Icon || '',
                    item.Desc || ''
                ].map(csvEscape).join(',');
            }).join('\r\n');
        }

        Array.from(document.getElementsByClassName('update-data')).forEach(function (btn) {
            btn.addEventListener('click', function (event) {
                event.preventDefault();
                bindData();
                document.getElementById('form-categories').submit();
            });
        });

        function buildDataTableColumns() {
            return [
                { data: 'Name', renderer: textSearchRenderer },
                { data: 'URL', renderer: textSearchRenderer },
                { data: 'LocalURL', type: 'autocomplete', source: localPortOptions, strict: false, filter: false, allowInvalid: true, renderer: localURLRenderer },
                { data: 'Category', editor: 'select', selectOptions: FLARE_FIX_CATEGORY.concat(categories.map(item => item.Name)), allowInvalid: false, renderer: textSearchRenderer },
                { data: 'Subdir', renderer: textSearchRenderer },
                { data: 'Icon', renderer: coverRenderer },
                { data: 'Desc', renderer: textSearchRenderer },
                { data: 'CheckResult', readOnly: true, renderer: linkCheckRenderer }
            ]
        }

        function normalizeSearchText(value) {
            return (value == null ? '' : String(value)).trim().toLowerCase();
        }

        function getBookmarkCellDisplayValue(item, prop) {
            if (!item) { return ''; }
            if (prop === 'LocalURL') {
                return localPortDisplayMap[item.LocalURL] || item.LocalURL || '';
            }
            return item[prop] == null ? '' : String(item[prop]);
        }

        function applySearchCellState(td, row, prop, displayText) {
            td.classList.remove('editor-search-match', 'editor-search-match-active');
            if (!bookmarkSearchState.term) { return; }
            const matchIndex = bookmarkSearchState.matches.findIndex(function (match) {
                return match.row === row && match.prop === prop;
            });
            if (matchIndex === -1) { return; }
            td.classList.add('editor-search-match');
            if (matchIndex === bookmarkSearchState.activeIndex) {
                td.classList.add('editor-search-match-active');
            }
        }

        function textSearchRenderer(instance, td, row, col, prop, value, cellProperties) {
            Handsontable.renderers.TextRenderer.apply(this, arguments);
            applySearchCellState(td, row, prop, value);
        }

        function localURLRenderer(instance, td, row, col, prop, value, cellProperties) {
            const display = localPortDisplayMap[value] || value || '';
            Handsontable.renderers.TextRenderer.apply(this, [instance, td, row, col, prop, display, cellProperties]);
            applySearchCellState(td, row, prop, display);
        }

        function linkCheckRenderer(instance, td, row, col, prop, value, cellProperties) {
            Handsontable.renderers.TextRenderer.apply(this, arguments);
            if (value) {
                td.className = (td.className || '') + ' link-check-invalid link-check-note';
            }
            applySearchCellState(td, row, prop, value);
        }

        function updateSearchStatus() {
            const total = bookmarkSearchState.matches.length;
            if (!bookmarkSearchState.term) {
                searchResultCount.textContent = '\u65e0\u641c\u7d22';
            } else if (!total) {
                searchResultCount.textContent = '\u672a\u627e\u5230';
            } else {
                searchResultCount.textContent = (bookmarkSearchState.activeIndex + 1) + ' / ' + total;
            }
            const disabled = total === 0;
            searchPrevButton.disabled = disabled;
            searchNextButton.disabled = disabled;
        }

        function focusActiveSearchMatch() {
            const activeMatch = bookmarkSearchState.matches[bookmarkSearchState.activeIndex];
            if (!activeMatch) { return; }
            const columnIndex = instanceBookmarks.propToCol(activeMatch.prop);
            if (typeof columnIndex !== 'number' || columnIndex < 0) { return; }
            instanceBookmarks.scrollViewportTo(activeMatch.row, columnIndex, true, true);
            instanceBookmarks.selectCell(activeMatch.row, columnIndex);
        }

        function runBookmarkSearch(rawTerm, shouldFocus) {
            const term = normalizeSearchText(rawTerm);
            bookmarkSearchState.term = term;
            bookmarkSearchState.matches = [];
            bookmarkSearchState.activeIndex = -1;

            if (term) {
                const rowCount = instanceBookmarks.countRows();
                for (let rowIndex = 0; rowIndex < rowCount; rowIndex += 1) {
                    const item = instanceBookmarks.getSourceDataAtRow(rowIndex) || {};
                    ['Name', 'URL', 'LocalURL', 'Category', 'Subdir', 'Desc', 'CheckResult'].forEach(function (prop) {
                        const display = normalizeSearchText(getBookmarkCellDisplayValue(item, prop));
                        if (display && display.indexOf(term) !== -1) {
                            bookmarkSearchState.matches.push({ row: rowIndex, prop: prop });
                        }
                    });
                }
            }

            if (bookmarkSearchState.matches.length) {
                bookmarkSearchState.activeIndex = 0;
            }

            updateSearchStatus();
            instanceBookmarks.render();
            if (shouldFocus && bookmarkSearchState.matches.length) {
                focusActiveSearchMatch();
            }
        }

        function moveBookmarkSearch(step) {
            const total = bookmarkSearchState.matches.length;
            if (!total) { return; }
            bookmarkSearchState.activeIndex = (bookmarkSearchState.activeIndex + step + total) % total;
            updateSearchStatus();
            instanceBookmarks.render();
            focusActiveSearchMatch();
        }

        function setButtonState(button, stateClass, text) {
            button.classList.remove('editor-button-state-success', 'editor-button-state-warning', 'editor-button-state-error');
            if (stateClass) {
                button.classList.add(stateClass);
            }
            if (text) {
                button.textContent = text;
            }
        }

        document.getElementById('back-home').addEventListener('click', function (e) {
            e.preventDefault();
            location.href = "/";
        })

        document.getElementById('check-links').addEventListener('click', function (e) {
            e.preventDefault();
            bindData();
            const btn = this;
            btn.disabled = true;
            setButtonState(btn, '', '\u68c0\u67e5\u4e2d...');
            fetch('/editor/check-links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bookmarks: document.getElementById('field-bookmarks').value })
            }).then(function (res) {
                return res.json();
            }).then(function (results) {
                bookmarks.forEach(function (item) { item.CheckResult = ''; });
                (results || []).forEach(function (result) {
                    const idx = Math.max(0, (result.row || 1) - 1);
                    if (bookmarks[idx]) {
                        bookmarks[idx].CheckResult = result.reason || '\u8fde\u63a5\u65e0\u6548';
                    }
                });
                runBookmarkSearch(searchField.value, false);
                instanceBookmarks.render();
                if (results && results.length) {
                    setButtonState(btn, 'editor-button-state-warning', '\u53d1\u73b0 ' + results.length + ' \u4e2a\u5f02\u5e38\u94fe\u63a5');
                } else {
                    setButtonState(btn, 'editor-button-state-success', '\u672a\u53d1\u73b0\u5f02\u5e38\u94fe\u63a5');
                }
                setTimeout(function () {
                    setButtonState(btn, '', '\u68c0\u67e5\u516c\u7f51\u65e0\u6548\u94fe\u63a5');
                    btn.disabled = false;
                }, 2500);
            }).catch(function () {
                setButtonState(btn, 'editor-button-state-error', '\u68c0\u67e5\u5931\u8d25');
                setTimeout(function () {
                    setButtonState(btn, '', '\u68c0\u67e5\u516c\u7f51\u65e0\u6548\u94fe\u63a5');
                    btn.disabled = false;
                }, 2500);
            });
        });


        function updateDataTable() {
            bookmarks.forEach(function (item) {
                if (localPortValueMap[item.LocalURL]) {
                    item.LocalURL = localPortValueMap[item.LocalURL];
                }
            });
            instanceBookmarks.updateData(bookmarks)
            instanceBookmarks.updateSettings({
                columns: buildDataTableColumns(),
                height: tableHeightForRows(bookmarks.length)
            })
            runBookmarkSearch(searchField.value, false);
            scheduleTableLayoutSync();
        }

        instanceBookmarks.addHook('afterChange', function (changes, source) {
            if (!changes || source === 'loadData') { return; }
            changes.forEach(function (change) {
                const row = change[0];
                const prop = change[1];
                const newValue = change[3];
                if (prop === 'LocalURL' && localPortValueMap[newValue]) {
                    instanceBookmarks.setDataAtRowProp(row, 'LocalURL', localPortValueMap[newValue], 'local-port-select');
                }
            });
        });

        instanceBookmarks.addHook('beforeKeyDown', function (event) {
            if (event.key !== 'Enter') { return; }
            const selected = instanceBookmarks.getSelectedLast();
            if (!selected) { return; }
            const prop = instanceBookmarks.colToProp(selected[1]);
            if (prop !== 'LocalURL') { return; }
            const editor = instanceBookmarks.getActiveEditor && instanceBookmarks.getActiveEditor();
            const inputValue = editor && editor.TEXTAREA ? editor.TEXTAREA.value : '';
            if ((inputValue || '').trim() !== '') { return; }
            event.preventDefault();
            if (event.stopImmediatePropagation) { event.stopImmediatePropagation(); }
            instanceBookmarks.setDataAtRowProp(selected[0], 'LocalURL', '', 'local-url-empty');
            if (editor && editor.close) { editor.close(); }
        });

        if (window.ResizeObserver) {
            const layoutObserver = new ResizeObserver(function () {
                scheduleTableLayoutSync();
            });
            document.querySelectorAll('.editor-table-shell').forEach(function (node) {
                layoutObserver.observe(node);
            });
        }

        window.addEventListener('load', scheduleTableLayoutSync);
        window.addEventListener('resize', scheduleTableLayoutSync);
        updateSearchStatus();
        scheduleTableLayoutSync();

    </script>
    <script>document.addEventListener('keydown', function (e) { if (e.key === 'Escape') history.back(); });</script>
</body>

</html>
